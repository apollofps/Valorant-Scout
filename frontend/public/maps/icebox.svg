<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="iceboxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1000" height="1000" fill="url(#iceboxBg)"/>
  
  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="0" y1="800" x2="1000" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
  </g>
  
  <!-- A Site -->
  <rect x="80" y="80" width="280" height="200" fill="rgba(255,70,85,0.15)" stroke="rgba(255,70,85,0.4)" stroke-width="2" rx="4"/>
  <text x="220" y="190" text-anchor="middle" fill="#FF4655" font-size="48" font-weight="bold" font-family="Arial, sans-serif">A</text>
  
  <!-- Rafters -->
  <rect x="80" y="280" width="120" height="120" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="140" y="345" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Rafters</text>
  
  <!-- Screens -->
  <rect x="200" y="280" width="160" height="120" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="280" y="345" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">A Belt</text>
  
  <!-- Mid -->
  <rect x="400" y="250" width="200" height="350" fill="rgba(100,100,120,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="4"/>
  <text x="500" y="435" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="24" font-weight="bold" font-family="Arial, sans-serif">MID</text>
  
  <!-- Tube -->
  <rect x="440" y="150" width="120" height="100" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="500" y="205" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Tube</text>
  
  <!-- B Site -->
  <rect x="640" y="80" width="280" height="200" fill="rgba(255,70,85,0.15)" stroke="rgba(255,70,85,0.4)" stroke-width="2" rx="4"/>
  <text x="780" y="190" text-anchor="middle" fill="#FF4655" font-size="48" font-weight="bold" font-family="Arial, sans-serif">B</text>
  
  <!-- Yellow -->
  <rect x="640" y="280" width="120" height="120" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="700" y="345" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Yellow</text>
  
  <!-- Green -->
  <rect x="760" y="280" width="160" height="120" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="840" y="345" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Green</text>
  
  <!-- Kitchen -->
  <rect x="640" y="400" width="120" height="100" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="700" y="455" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Kitchen</text>
  
  <!-- Defender Spawn -->
  <rect x="400" y="50" width="200" height="50" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="2" rx="4"/>
  <text x="500" y="82" text-anchor="middle" fill="rgba(59,130,246,0.8)" font-size="12" font-family="Arial, sans-serif">DEF SPAWN</text>
  
  <!-- Attacker Spawn -->
  <rect x="350" y="850" width="300" height="100" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="2" rx="4"/>
  <text x="500" y="905" text-anchor="middle" fill="rgba(34,197,94,0.8)" font-size="16" font-family="Arial, sans-serif">ATK SPAWN</text>
  
  <!-- A Main -->
  <rect x="100" y="500" width="200" height="200" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="200" y="605" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">A Main</text>
  
  <!-- B Main -->
  <rect x="700" y="500" width="200" height="200" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="800" y="605" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">B Main</text>
  
  <text x="500" y="980" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="24" font-weight="bold" font-family="Arial, sans-serif">ICEBOX</text>
</svg>
