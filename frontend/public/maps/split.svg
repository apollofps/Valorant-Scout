<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#splitBg)"/>
  
  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="250" x2="1000" y2="250"/>
    <line x1="0" y1="500" x2="1000" y2="500"/>
    <line x1="0" y1="750" x2="1000" y2="750"/>
    <line x1="250" y1="0" x2="250" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="750" y1="0" x2="750" y2="1000"/>
  </g>
  
  <!-- A Site -->
  <rect x="80" y="60" width="300" height="180" fill="rgba(255,70,85,0.15)" stroke="rgba(255,70,85,0.4)" stroke-width="2" rx="4"/>
  <text x="230" y="160" text-anchor="middle" fill="#FF4655" font-size="48" font-weight="bold" font-family="Arial, sans-serif">A</text>
  
  <!-- A Ramp -->
  <rect x="80" y="240" width="120" height="160" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="140" y="325" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">A Ramp</text>
  
  <!-- A Main -->
  <rect x="200" y="240" width="180" height="140" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="290" y="315" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">A Main</text>
  
  <!-- Screens -->
  <rect x="80" y="400" width="100" height="120" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="130" y="465" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Screens</text>
  
  <!-- Mid Area -->
  <rect x="400" y="200" width="200" height="400" fill="rgba(100,100,120,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="4"/>
  <text x="500" y="410" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="24" font-weight="bold" font-family="Arial, sans-serif">MID</text>
  
  <!-- Mail -->
  <rect x="400" y="100" width="100" height="100" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="450" y="155" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Mail</text>
  
  <!-- Vent -->
  <rect x="500" y="100" width="100" height="100" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="550" y="155" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Vent</text>
  
  <!-- B Site -->
  <rect x="620" y="60" width="300" height="180" fill="rgba(255,70,85,0.15)" stroke="rgba(255,70,85,0.4)" stroke-width="2" rx="4"/>
  <text x="770" y="160" text-anchor="middle" fill="#FF4655" font-size="48" font-weight="bold" font-family="Arial, sans-serif">B</text>
  
  <!-- B Main -->
  <rect x="620" y="240" width="180" height="140" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="710" y="315" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">B Main</text>
  
  <!-- B Lobby/Link -->
  <rect x="800" y="240" width="120" height="160" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="860" y="325" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">B Link</text>
  
  <!-- Heaven (B) -->
  <rect x="800" y="400" width="120" height="100" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="860" y="455" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Heaven</text>
  
  <!-- Defender Spawn -->
  <rect x="400" y="50" width="200" height="50" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="2" rx="4"/>
  <text x="500" y="82" text-anchor="middle" fill="rgba(59,130,246,0.8)" font-size="14" font-family="Arial, sans-serif">DEF SPAWN</text>
  
  <!-- Attacker Spawn -->
  <rect x="350" y="850" width="300" height="100" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="2" rx="4"/>
  <text x="500" y="905" text-anchor="middle" fill="rgba(34,197,94,0.8)" font-size="16" font-family="Arial, sans-serif">ATK SPAWN</text>
  
  <!-- A Lobby -->
  <rect x="180" y="600" width="160" height="200" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="260" y="705" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">A Lobby</text>
  
  <!-- B Lobby -->
  <rect x="660" y="600" width="160" height="200" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="740" y="705" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">B Lobby</text>
  
  <!-- Map title -->
  <text x="500" y="980" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="24" font-weight="bold" font-family="Arial, sans-serif">SPLIT</text>
</svg>
