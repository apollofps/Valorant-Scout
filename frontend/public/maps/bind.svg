<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="bindBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1f3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bindBg)"/>
  
  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="0" y1="800" x2="1000" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
  </g>
  
  <!-- A Site -->
  <rect x="50" y="100" width="300" height="200" fill="rgba(255,70,85,0.15)" stroke="rgba(255,70,85,0.4)" stroke-width="2" rx="4"/>
  <text x="200" y="210" text-anchor="middle" fill="#FF4655" font-size="48" font-weight="bold" font-family="Arial, sans-serif">A</text>
  
  <!-- A Short -->
  <rect x="50" y="300" width="140" height="180" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="120" y="395" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">A Short</text>
  
  <!-- A Bath/Showers -->
  <rect x="190" y="300" width="160" height="120" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="270" y="365" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Showers</text>
  
  <!-- A Long -->
  <rect x="50" y="480" width="140" height="200" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="120" y="585" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">A Long</text>
  
  <!-- Teleporter A -->
  <rect x="350" y="200" width="80" height="80" fill="rgba(168,85,247,0.3)" stroke="rgba(168,85,247,0.6)" stroke-width="2" rx="40"/>
  <text x="390" y="245" text-anchor="middle" fill="rgba(168,85,247,0.9)" font-size="12" font-weight="bold" font-family="Arial, sans-serif">TP</text>
  
  <!-- B Site -->
  <rect x="650" y="100" width="300" height="200" fill="rgba(255,70,85,0.15)" stroke="rgba(255,70,85,0.4)" stroke-width="2" rx="4"/>
  <text x="800" y="210" text-anchor="middle" fill="#FF4655" font-size="48" font-weight="bold" font-family="Arial, sans-serif">B</text>
  
  <!-- B Short/Elbow -->
  <rect x="810" y="300" width="140" height="180" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="880" y="395" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">B Short</text>
  
  <!-- Hookah/Window -->
  <rect x="650" y="300" width="160" height="120" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="730" y="365" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Hookah</text>
  
  <!-- B Long -->
  <rect x="810" y="480" width="140" height="200" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="880" y="585" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">B Long</text>
  
  <!-- Teleporter B -->
  <rect x="570" y="200" width="80" height="80" fill="rgba(168,85,247,0.3)" stroke="rgba(168,85,247,0.6)" stroke-width="2" rx="40"/>
  <text x="610" y="245" text-anchor="middle" fill="rgba(168,85,247,0.9)" font-size="12" font-weight="bold" font-family="Arial, sans-serif">TP</text>
  
  <!-- Defender Spawn -->
  <rect x="400" y="80" width="200" height="80" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="2" rx="4"/>
  <text x="500" y="125" text-anchor="middle" fill="rgba(59,130,246,0.8)" font-size="14" font-family="Arial, sans-serif">DEF SPAWN</text>
  
  <!-- Attacker Spawn -->
  <rect x="350" y="850" width="300" height="100" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="2" rx="4"/>
  <text x="500" y="905" text-anchor="middle" fill="rgba(34,197,94,0.8)" font-size="16" font-family="Arial, sans-serif">ATK SPAWN</text>
  
  <!-- A Lobby -->
  <rect x="190" y="560" width="200" height="180" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="290" y="655" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">A Lobby</text>
  
  <!-- B Lobby -->
  <rect x="610" y="560" width="200" height="180" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="710" y="655" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">B Lobby</text>
  
  <!-- Map title -->
  <text x="500" y="980" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="24" font-weight="bold" font-family="Arial, sans-serif">BIND</text>
</svg>
