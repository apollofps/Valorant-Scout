<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="abyssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1000" height="1000" fill="url(#abyssBg)"/>
  
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="0" y1="800" x2="1000" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
  </g>
  
  <!-- A Site -->
  <rect x="80" y="100" width="280" height="200" fill="rgba(255,70,85,0.15)" stroke="rgba(255,70,85,0.4)" stroke-width="2" rx="4"/>
  <text x="220" y="210" text-anchor="middle" fill="#FF4655" font-size="48" font-weight="bold" font-family="Arial, sans-serif">A</text>
  
  <!-- A Main -->
  <rect x="80" y="300" width="140" height="200" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="150" y="405" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">A Main</text>
  
  <!-- A Short -->
  <rect x="220" y="300" width="140" height="120" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="290" y="365" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">A Short</text>
  
  <!-- Mid -->
  <rect x="400" y="280" width="200" height="350" fill="rgba(100,100,120,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="4"/>
  <text x="500" y="465" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="24" font-weight="bold" font-family="Arial, sans-serif">MID</text>
  
  <!-- Mid Top -->
  <rect x="420" y="150" width="160" height="130" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="500" y="220" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">Mid Top</text>
  
  <!-- B Site -->
  <rect x="640" y="100" width="280" height="200" fill="rgba(255,70,85,0.15)" stroke="rgba(255,70,85,0.4)" stroke-width="2" rx="4"/>
  <text x="780" y="210" text-anchor="middle" fill="#FF4655" font-size="48" font-weight="bold" font-family="Arial, sans-serif">B</text>
  
  <!-- B Main -->
  <rect x="780" y="300" width="140" height="200" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="850" y="405" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">B Main</text>
  
  <!-- B Short -->
  <rect x="640" y="300" width="140" height="120" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="710" y="365" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">B Short</text>
  
  <!-- Void zones (unique to Abyss) -->
  <rect x="350" y="680" width="100" height="60" fill="rgba(168,85,247,0.2)" stroke="rgba(168,85,247,0.5)" stroke-width="2" rx="4"/>
  <text x="400" y="715" text-anchor="middle" fill="rgba(168,85,247,0.8)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">VOID</text>
  
  <rect x="550" y="680" width="100" height="60" fill="rgba(168,85,247,0.2)" stroke="rgba(168,85,247,0.5)" stroke-width="2" rx="4"/>
  <text x="600" y="715" text-anchor="middle" fill="rgba(168,85,247,0.8)" font-size="10" font-weight="bold" font-family="Arial, sans-serif">VOID</text>
  
  <!-- Defender Spawn -->
  <rect x="400" y="50" width="200" height="60" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="2" rx="4"/>
  <text x="500" y="87" text-anchor="middle" fill="rgba(59,130,246,0.8)" font-size="14" font-family="Arial, sans-serif">DEF SPAWN</text>
  
  <!-- Attacker Spawn -->
  <rect x="350" y="850" width="300" height="100" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="2" rx="4"/>
  <text x="500" y="905" text-anchor="middle" fill="rgba(34,197,94,0.8)" font-size="16" font-family="Arial, sans-serif">ATK SPAWN</text>
  
  <!-- A Lobby -->
  <rect x="120" y="570" width="200" height="180" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="220" y="665" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">A Lobby</text>
  
  <!-- B Lobby -->
  <rect x="680" y="570" width="200" height="180" fill="rgba(100,100,120,0.2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="2"/>
  <text x="780" y="665" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">B Lobby</text>
  
  <text x="500" y="980" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="24" font-weight="bold" font-family="Arial, sans-serif">ABYSS</text>
</svg>
